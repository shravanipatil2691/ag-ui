<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-UI Task Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <div class="max-w-7xl mx-auto p-4 lg:p-6 flex flex-col h-screen max-h-screen">
        <header class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-bold text-slate-950">
                    AG</div>
                <div>
                    <h1 class="font-bold text-lg text-white flex items-center gap-2">
                        Task Copilot
                        <span
                            class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono">v1.0
                            SSE</span>
                    </h1>
                    <p class="text-xs text-slate-400">Agent-User Interaction</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-new-thread"
                    class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    New Thread
                </button>
                <button id="btn-retry"
                    class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Retry
                </button>
                <button id="btn-stop" disabled
                    class="px-3 py-1.5 text-xs font-medium rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/40 transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="6" y="6" width="12" height="12" rx="2" stroke-width="2" />
                    </svg>
                    Stop
                </button>
            </div>
        </header>

        <div id="error-banner"
            class="hidden my-3 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-start gap-2.5">
            <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div class="flex-1 font-mono text-[11px]" id="error-text"></div>
            <button onclick="document.getElementById('error-banner').classList.add('hidden')"
                class="text-rose-400 hover:text-white">&times;</button>
        </div>

        <div class="flex items-center gap-2 py-2 overflow-x-auto border-b border-slate-800 text-xs font-mono"
            id="steps-bar"></div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 py-4 min-h-0">
            <section
                class="lg:col-span-7 flex flex-col bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="px-4 py-2.5 border-b border-slate-800/80 bg-slate-900 flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Conversation
                    </span>
                    <span id="thread-pill" class="text-[11px] font-mono text-slate-500"></span>
                </div>

                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

                <div class="p-3 border-t border-slate-800/80 bg-slate-900/90">
                    <form id="chat-form" class="flex gap-2">
                        <input id="prompt-input" type="text"
                            placeholder="e.g. Plan a 3-day itinerary for Kyoto or Kolhapur..."
                            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <button type="submit" id="btn-send"
                            class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/20 disabled:opacity-50">
                            <span>Send</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </button>
                    </form>
                </div>
            </section>

            <section class="lg:col-span-5 flex flex-col gap-4 min-h-0">
                <div
                    class="flex-1 bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col overflow-hidden shadow-xl">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-300">Shared Plan State
                            </h2>
                        </div>
                        <span id="plan-progress-pill"
                            class="text-xs font-mono px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">0%</span>
                    </div>

                    <div class="py-3">
                        <div class="flex justify-between items-center mb-1 text-xs">
                            <span id="plan-title" class="font-medium text-slate-200 truncate">No active plan</span>
                            <span id="plan-budget" class="text-slate-400 font-mono">Budget: $0</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                            <div id="plan-progress-bar"
                                class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2 transition-all duration-300"
                                style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="plan-items"></div>
                </div>

                <div
                    class="h-48 bg-slate-900/60 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-xl">
                    <div class="px-4 py-2 border-b border-slate-800 bg-slate-900 flex items-center justify-between cursor-pointer"
                        onclick="toggleInspector()">
                        <span
                            class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                            </svg>
                            Event Inspector
                        </span>
                        <div class="flex items-center gap-2">
                            <select id="event-filter"
                                class="bg-slate-950 text-[11px] font-mono text-slate-300 border border-slate-700 rounded px-1.5 py-0.5"
                                onclick="event.stopPropagation()">
                                <option value="ALL">ALL EVENTS</option>
                                <option value="RUN_">RUN_*</option>
                                <option value="STEP_">STEP_*</option>
                                <option value="TOOL_">TOOL_*</option>
                                <option value="STATE_">STATE_*</option>
                                <option value="TEXT_">TEXT_*</option>
                            </select>
                            <span id="event-count" class="text-[11px] font-mono text-slate-500">0</span>
                        </div>
                    </div>
                    <div id="event-log" class="flex-1 overflow-y-auto p-2 space-y-1 font-mono text-[11px]"></div>
                </div>
            </section>
        </div>
    </div>

    <div id="approval-modal"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div
            class="bg-slate-900 border border-indigo-500/30 rounded-2xl max-w-md w-full p-6 shadow-2xl shadow-indigo-500/10 space-y-4">
            <div class="flex items-center gap-3 text-amber-400">
                <div
                    class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <div>
                    <h3 class="font-semibold text-white text-base">Approval Requested</h3>
                    <p class="text-xs text-slate-400 font-mono">Frontend Tool: request_approval</p>
                </div>
            </div>
            <div class="bg-slate-950 rounded-xl p-3 border border-slate-800 space-y-2 text-xs">
                <div>
                    <span class="text-slate-500 block">Action</span>
                    <span id="modal-action" class="font-medium text-slate-200"></span>
                </div>
                <div>
                    <span class="text-slate-500 block">Details</span>
                    <span id="modal-details" class="text-slate-300"></span>
                </div>
                <div>
                    <span class="text-slate-500 block">Estimated Cost</span>
                    <span id="modal-cost" class="font-mono text-emerald-400 font-semibold"></span>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="btn-approve"
                    class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm transition shadow-lg shadow-emerald-600/20">
                    Approve
                </button>
                <button id="btn-decline"
                    class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm border border-slate-700 transition">
                    Decline
                </button>
            </div>
        </div>
    </div>

    <script>
        let threadId = "thr-" + crypto.randomUUID().slice(0, 8);
        let currentRunId = null;
        let messages = [];
        let state = { title: "Trip & Project Itinerary", items: [], budget: 1200, progress: 0 };
        let activeSteps = new Map();
        let openToolCalls = new Map();
        let currentAssistantMessageId = null;
        let abortController = null;
        let pendingApproval = null;
        let lastUserPrompt = "";
        const allEvents = [];

        const $ = id => document.getElementById(id);
        $("thread-pill").textContent = threadId;

        function applyPatch(doc, ops) {
            let next = JSON.parse(JSON.stringify(doc));
            for (const op of ops) {
                const parts = op.path.split("/").slice(1).map(p => p.replace(/~1/g, "/").replace(/~0/g, "~"));
                if (parts.length === 0) {
                    if (op.op === "replace") next = op.value;
                    continue;
                }
                const last = parts.pop();
                let curr = next;
                for (const p of parts) {
                    if (curr[p] === undefined) curr[p] = {};
                    curr = curr[p];
                }
                if (op.op === "add") {
                    if (Array.isArray(curr)) {
                        if (last === "-") curr.push(op.value);
                        else curr.splice(parseInt(last, 10), 0, op.value);
                    } else {
                        curr[last] = op.value;
                    }
                } else if (op.op === "replace") {
                    curr[last] = op.value;
                } else if (op.op === "remove") {
                    if (Array.isArray(curr)) curr.splice(parseInt(last, 10), 1);
                    else delete curr[last];
                }
            }
            return next;
        }

        function renderState() {
            $("plan-title").textContent = state.title || "Trip & Project Itinerary";
            $("plan-budget").textContent = `Budget: $${state.budget || 0}`;
            $("plan-progress-pill").textContent = `${state.progress || 0}%`;
            $("plan-progress-bar").style.width = `${state.progress || 0}%`;

            const container = $("plan-items");
            container.innerHTML = "";
            if (!state.items || state.items.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 text-center py-6">No items planned yet. Ask the copilot to start!</div>`;
                return;
            }

            const daysMap = new Map();
            state.items.forEach(item => {
                const day = item.day || 1;
                if (!daysMap.has(day)) daysMap.set(day, []);
                daysMap.get(day).push(item);
            });

            const sortedDays = Array.from(daysMap.keys()).sort((a, b) => a - b);
            sortedDays.forEach(day => {
                const header = document.createElement("div");
                header.className = "text-[11px] font-semibold uppercase tracking-wider text-indigo-400 mt-3 mb-1.5 flex items-center gap-2";
                header.innerHTML = `<span>Day ${day}</span><span class="flex-1 border-b border-slate-800"></span>`;
                container.appendChild(header);

                daysMap.get(day).forEach(item => {
                    const el = document.createElement("div");
                    el.className = "p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/80 flex items-center justify-between text-xs mb-1.5";
                    let badgeClass = "bg-slate-800 text-slate-300";
                    if (item.status === "confirmed") badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                    else if (item.status === "declined") badgeClass = "bg-rose-500/10 text-rose-400 border border-rose-500/20";
                    else if (item.status === "pending_approval") badgeClass = "bg-amber-500/10 text-amber-400 border border-amber-500/20 animate-pulse";

                    el.innerHTML = `
                        <div class="flex-1 pr-2 truncate">
                            <div class="font-medium text-slate-200 truncate">${item.title}</div>
                            <div class="text-[11px] text-slate-500 flex items-center gap-2 mt-0.5 font-mono">
                                <span>${item.type || 'Activity'}</span>
                                ${item.rating ? `<span>★ ${item.rating}</span>` : ''}
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-mono text-slate-300">$${item.cost || 0}</div>
                            <span class="inline-block mt-0.5 text-[10px] font-mono px-1.5 py-0.5 rounded ${badgeClass}">${item.status || 'planned'}</span>
                        </div>
                    `;
                    container.appendChild(el);
                });
            });
        }

        function renderSteps() {
            const bar = $("steps-bar");
            bar.innerHTML = "";
            activeSteps.forEach((status, name) => {
                const s = document.createElement("span");
                s.className = `px-2 py-0.5 rounded-full border flex items-center gap-1.5 ${status === 'done' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400'}`;
                s.innerHTML = status === 'done'
                    ? `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ${name}`
                    : `<span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span> ${name}`;
                bar.appendChild(s);
            });
        }

        function addChatMessage(role, content, extra = null) {
            const container = $("chat-messages");
            const div = document.createElement("div");
            div.className = `flex flex-col ${role === 'user' ? 'items-end' : 'items-start'}`;

            if (role === 'user') {
                div.innerHTML = `
                    <div class="max-w-[85%] rounded-2xl px-4 py-2.5 bg-indigo-600 text-white text-sm shadow">
                        ${content}
                    </div>
                `;
            } else if (role === 'tool') {
                div.innerHTML = `
                    <div class="max-w-[90%] my-1 p-2 rounded-xl bg-slate-950 border border-slate-800 text-[11px] font-mono text-slate-400">
                        <div class="text-indigo-400 font-semibold mb-1 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                            ${extra ? extra.name : 'Tool'}
                        </div>
                        <div class="args whitespace-pre-wrap text-slate-300">${extra ? extra.args : ''}</div>
                        ${extra && extra.result ? `<div class="mt-1 pt-1 border-t border-slate-800/80 text-emerald-400">${extra.result}</div>` : ''}
                    </div>
                `;
            } else {
                div.id = `msg-${extra ? extra.id : crypto.randomUUID()}`;
                div.innerHTML = `
                    <div class="max-w-[90%] rounded-2xl px-4 py-3 bg-slate-800/90 border border-slate-700/60 text-slate-200 text-sm shadow-md leading-relaxed whitespace-pre-wrap">${content}</div>
                `;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function appendAssistantDelta(msgId, delta) {
            let el = document.getElementById(`msg-${msgId}`);
            if (!el) {
                el = addChatMessage("assistant", "", { id: msgId });
            }
            const inner = el.querySelector("div");
            inner.textContent += delta;
            $("chat-messages").scrollTop = $("chat-messages").scrollHeight;
        }

        function appendInspectorEvent(ev) {
            allEvents.push(ev);
            $("event-count").textContent = allEvents.length;
            const filter = $("event-filter").value;
            if (filter !== "ALL" && !ev.type.startsWith(filter)) return;

            const row = document.createElement("div");
            row.className = "p-1.5 rounded bg-slate-950 border border-slate-800/60 hover:border-slate-700 transition cursor-pointer";
            const time = new Date().toLocaleTimeString().split(" ")[0];

            let badgeColor = "text-indigo-400";
            if (ev.type.startsWith("RUN_")) badgeColor = "text-purple-400";
            else if (ev.type.startsWith("TOOL_")) badgeColor = "text-amber-400";
            else if (ev.type.startsWith("STATE_")) badgeColor = "text-emerald-400";

            row.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="font-bold ${badgeColor}">${ev.type}</span>
                    <span class="text-slate-600 text-[10px]">${time}</span>
                </div>
                <pre class="hidden mt-1 text-[10px] text-slate-400 overflow-x-auto p-1 bg-slate-900 rounded">${JSON.stringify(ev, null, 2)}</pre>
            `;
            row.onclick = () => {
                const pre = row.querySelector("pre");
                pre.classList.toggle("hidden");
            };

            const log = $("event-log");
            log.appendChild(row);
            log.scrollTop = log.scrollHeight;
        }

        $("event-filter").onchange = () => {
            const log = $("event-log");
            log.innerHTML = "";
            const filter = $("event-filter").value;
            allEvents.forEach(ev => {
                if (filter === "ALL" || ev.type.startsWith(filter)) {
                    const row = document.createElement("div");
                    row.className = "p-1.5 rounded bg-slate-950 border border-slate-800/60 hover:border-slate-700 transition cursor-pointer";
                    row.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-300">${ev.type}</span>
                        </div>
                        <pre class="hidden mt-1 text-[10px] text-slate-400 overflow-x-auto p-1 bg-slate-900 rounded">${JSON.stringify(ev, null, 2)}</pre>
                    `;
                    row.onclick = () => row.querySelector("pre").classList.toggle("hidden");
                    log.appendChild(row);
                }
            });
        };

        function showError(msg) {
            $("error-text").textContent = msg;
            $("error-banner").classList.remove("hidden");
        }

        function handleEvent(ev) {
            appendInspectorEvent(ev);

            switch (ev.type) {
                case "RUN_STARTED":
                    $("btn-stop").disabled = false;
                    $("btn-send").disabled = true;
                    break;
                case "RUN_FINISHED":
                    $("btn-stop").disabled = true;
                    $("btn-send").disabled = false;
                    if (ev.outcome && ev.outcome.pendingToolCallIds && ev.outcome.pendingToolCallIds.length > 0) {
                        for (const id of ev.outcome.pendingToolCallIds) {
                            if (openToolCalls.has(id)) {
                                const tool = openToolCalls.get(id);
                                if (tool.name === "request_approval") {
                                    try {
                                        const parsed = JSON.parse(tool.args);
                                        openApprovalModal(id, parsed);
                                    } catch (e) {
                                        openApprovalModal(id, { action: "Approval needed", details: tool.args, cost: 0 });
                                    }
                                }
                            }
                        }
                    }
                    break;
                case "RUN_ERROR":
                    $("btn-stop").disabled = true;
                    $("btn-send").disabled = false;
                    showError(`RUN_ERROR: ${ev.message || 'Agent error'} (code: ${ev.code || 'UNKNOWN'})`);
                    break;
                case "STEP_STARTED":
                    activeSteps.set(ev.stepName, "active");
                    renderSteps();
                    break;
                case "STEP_FINISHED":
                    activeSteps.set(ev.stepName, "done");
                    renderSteps();
                    break;
                case "STATE_SNAPSHOT":
                    state = ev.snapshot;
                    renderState();
                    break;
                case "STATE_DELTA":
                    state = applyPatch(state, ev.delta);
                    renderState();
                    break;
                case "TEXT_MESSAGE_START":
                    currentAssistantMessageId = ev.messageId;
                    addChatMessage("assistant", "", { id: ev.messageId });
                    break;
                case "TEXT_MESSAGE_CONTENT":
                    appendAssistantDelta(ev.messageId, ev.delta);
                    break;
                case "TEXT_MESSAGE_END":
                    const el = document.getElementById(`msg-${ev.messageId}`);
                    if (el) {
                        const txt = el.querySelector("div").textContent;
                        messages.push({ id: ev.messageId, role: "assistant", content: txt });
                    }
                    currentAssistantMessageId = null;
                    break;
                case "TOOL_CALL_START":
                    openToolCalls.set(ev.toolCallId, { name: ev.toolCallName, args: "", div: null });
                    const tDiv = addChatMessage("tool", "", { name: ev.toolCallName, args: "" });
                    openToolCalls.get(ev.toolCallId).div = tDiv;
                    break;
                case "TOOL_CALL_ARGS":
                    if (openToolCalls.has(ev.toolCallId)) {
                        const t = openToolCalls.get(ev.toolCallId);
                        t.args += ev.delta;
                        if (t.div) t.div.querySelector(".args").textContent = t.args;
                    }
                    break;
                case "TOOL_CALL_END":
                    break;
                case "TOOL_CALL_RESULT":
                    if (openToolCalls.has(ev.toolCallId)) {
                        const t = openToolCalls.get(ev.toolCallId);
                        t.result = ev.content;
                        if (t.div) {
                            let resEl = t.div.querySelector(".result");
                            if (!resEl) {
                                resEl = document.createElement("div");
                                resEl.className = "result mt-1 pt-1 border-t border-slate-800 text-emerald-400";
                                t.div.querySelector("div").appendChild(resEl);
                            }
                            resEl.textContent = `Result: ${ev.content}`;
                        }
                    }
                    break;
            }
        }

        async function runAgent(extraMessages = []) {
            currentRunId = "run-" + crypto.randomUUID().slice(0, 8);
            abortController = new AbortController();
            $("btn-stop").disabled = false;
            $("btn-send").disabled = true;

            const outgoingMessages = [...messages, ...extraMessages];
            const payload = {
                threadId,
                runId: currentRunId,
                protocolVersion: "1.0",
                messages: outgoingMessages,
                tools: [
                    {
                        name: "request_approval",
                        description: "Request human approval for booking or financial commitments",
                        parameters: {
                            type: "object",
                            properties: {
                                action: { type: "string" },
                                details: { type: "string" },
                                cost: { type: "number" }
                            },
                            required: ["action", "details"]
                        }
                    }
                ],
                state,
                context: [],
                forwardedProps: {}
            };

            const endpoint = (window.location.protocol === "http:" || window.location.protocol === "https:") && (window.location.port === "8000" || window.location.port === "")
                ? "/agent"
                : "http://127.0.0.1:8000/agent";

            let response;
            try {
                response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "text/event-stream"
                    },
                    body: JSON.stringify(payload),
                    signal: abortController.signal
                });
            } catch (err) {
                if (err.name === "AbortError") {
                    showError("Run cancelled by user.");
                } else {
                    showError(`HTTP Error: ${err.message}`);
                }
                $("btn-stop").disabled = true;
                $("btn-send").disabled = false;
                return;
            }

            if (!response.ok) {
                const txt = await response.text();
                showError(`Server error (${response.status}): ${txt}`);
                $("btn-stop").disabled = true;
                $("btn-send").disabled = false;
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";
            let terminalReceived = false;

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop();

                    for (const block of lines) {
                        for (const line of block.split("\n")) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith("data:")) {
                                const jsonStr = trimmed.slice(5).trim();
                                if (jsonStr) {
                                    try {
                                        const ev = JSON.parse(jsonStr);
                                        if (ev.type === "RUN_FINISHED" || ev.type === "RUN_ERROR") {
                                            terminalReceived = true;
                                        }
                                        handleEvent(ev);
                                    } catch (e) {
                                        console.error("Parse error", e, jsonStr);
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                if (err.name === "AbortError") {
                    showError("Run aborted by client.");
                } else {
                    showError(`Stream network drop: ${err.message}`);
                }
            } finally {
                $("btn-stop").disabled = true;
                $("btn-send").disabled = false;
                if (!terminalReceived && !abortController.signal.aborted) {
                    showError("Warning: Stream ended unexpectedly without terminal RUN_FINISHED or RUN_ERROR event.");
                }
            }
        }

        function openApprovalModal(toolCallId, data) {
            pendingApproval = { toolCallId, data };
            $("modal-action").textContent = data.action || "Confirmation Required";
            $("modal-details").textContent = data.details || "The agent is requesting approval to continue.";
            $("modal-cost").textContent = data.cost !== undefined ? `$${data.cost}` : "Included";
            $("approval-modal").classList.remove("hidden");
        }

        function closeApprovalModal() {
            $("approval-modal").classList.add("hidden");
        }

        $("btn-approve").onclick = () => {
            if (!pendingApproval) return;
            const toolId = pendingApproval.toolCallId;
            closeApprovalModal();

            const toolMsg = {
                id: "msg-" + crypto.randomUUID().slice(0, 8),
                role: "tool",
                toolCallId: toolId,
                content: JSON.stringify({ approved: true })
            };
            messages.push(toolMsg);
            addChatMessage("tool", "", { name: "request_approval (Human approved)", args: JSON.stringify({ approved: true }), result: "Approved by user" });
            runAgent();
            pendingApproval = null;
        };

        $("btn-decline").onclick = () => {
            if (!pendingApproval) return;
            const toolId = pendingApproval.toolCallId;
            closeApprovalModal();

            const toolMsg = {
                id: "msg-" + crypto.randomUUID().slice(0, 8),
                role: "tool",
                toolCallId: toolId,
                content: JSON.stringify({ approved: false })
            };
            messages.push(toolMsg);
            addChatMessage("tool", "", { name: "request_approval (Human declined)", args: JSON.stringify({ approved: false }), result: "Declined by user" });
            runAgent();
            pendingApproval = null;
        };

        $("chat-form").onsubmit = e => {
            e.preventDefault();
            const text = $("prompt-input").value.trim();
            if (!text) return;
            lastUserPrompt = text;
            $("prompt-input").value = "";

            const userMsg = { id: "msg-" + crypto.randomUUID().slice(0, 8), role: "user", content: text };
            messages.push(userMsg);
            addChatMessage("user", text);
            runAgent();
        };

        $("btn-stop").onclick = () => {
            if (abortController) abortController.abort();
        };

        $("btn-retry").onclick = () => {
            if (!lastUserPrompt) return;
            const userMsg = { id: "msg-" + crypto.randomUUID().slice(0, 8), role: "user", content: lastUserPrompt };
            messages.push(userMsg);
            addChatMessage("user", lastUserPrompt);
            runAgent();
        };

        $("btn-new-thread").onclick = () => {
            threadId = "thr-" + crypto.randomUUID().slice(0, 8);
            $("thread-pill").textContent = threadId;
            messages = [];
            state = { title: "Trip & Project Itinerary", items: [], budget: 1200, progress: 0 };
            activeSteps.clear();
            openToolCalls.clear();
            allEvents.length = 0;
            $("chat-messages").innerHTML = "";
            $("steps-bar").innerHTML = "";
            $("event-log").innerHTML = "";
            $("event-count").textContent = "0";
            renderState();
        };

        renderState();
    </script>
</body>

</html>
